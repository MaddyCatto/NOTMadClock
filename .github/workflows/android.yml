
name: Build MadClock APK pair

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Robolectric's Android 16 runtime requires Java 21; APK bytecode stays Java 17.
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Build both APKs and test alarms, UI and separate audio
        run: gradle :app:assembleDebug :audio:assembleDebug :app:testDebugUnitTest :audio:testDebugUnitTest :app:lintDebug :audio:lintDebug --stacktrace --no-daemon --max-workers=4

      - name: Verify and package the matching APK pair
        run: |
          python3 scripts/check_apks.py
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MadClock-debug.apk
          cp audio/build/outputs/apk/debug/audio-debug.apk dist/MadClock-Audio-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MadClock-1.0-debug-pair
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload Android View renders
        uses: actions/upload-artifact@v4
        with:
          name: MadClock-Deep-Purple-screens
          path: app/build/reports/screenshots/*.png
          if-no-files-found: error
