
name: Build MadClock APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Robolectric's Android 16 runtime requires Java 21; APK bytecode stays Java 17.
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Build APK, test recovery and run lint
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon --max-workers=4

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MadClock-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
