
name: Build MadClock APK pair

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Robolectric's Android 16 runtime requires Java 21; APK bytecode stays Java 17.
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Initialize CodeQL (Java and Kotlin)
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build both APKs and test alarms, UI and separate audio
        run: gradle :app:assembleDebug :audio:assembleDebug :app:testDebugUnitTest :audio:testDebugUnitTest :app:lintDebug :audio:lintDebug securityDependencyInventory --stacktrace --no-daemon --max-workers=4

      - name: Check resolved dependencies against GitHub Maven advisories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_dependencies.py

      - name: Analyze Java and Kotlin with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:java-kotlin

      - name: Verify and package the matching APK pair
        run: |
          python3 scripts/check_apks.py
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MadClock-debug.apk
          cp audio/build/outputs/apk/debug/audio-debug.apk dist/MadClock-Audio-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MadClock-1.0-debug-pair
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload Android View renders
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MadClock-Deep-Purple-screens
          path: app/build/reports/screenshots/*.png
          if-no-files-found: error

      - name: Upload security and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MadClock-security-reports
          path: |
            build/reports/security/
            app/build/reports/lint-results-debug.*
            audio/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            audio/build/test-results/testDebugUnitTest/TEST-*.xml
