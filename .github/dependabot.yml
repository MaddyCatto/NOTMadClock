version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Disable routine version churn; security-update PRs are independent of this limit.
    open-pull-requests-limit: 0
